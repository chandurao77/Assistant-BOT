<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="28" stroke="url(#grad1)" stroke-width="2" opacity="0.3"/>
  
  <!-- Main globe circle -->
  <circle cx="32" cy="32" r="22" stroke="url(#grad1)" stroke-width="2.5" fill="none"/>
  
  <!-- Latitude lines -->
  <ellipse cx="32" cy="32" rx="22" ry="8" stroke="url(#grad1)" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="32" cy="32" rx="22" ry="15" stroke="url(#grad1)" stroke-width="1.2" opacity="0.4"/>
  
  <!-- Longitude lines -->
  <ellipse cx="32" cy="32" rx="8" ry="22" stroke="url(#grad1)" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="32" cy="32" rx="15" ry="22" stroke="url(#grad1)" stroke-width="1.2" opacity="0.4"/>
  
  <!-- Vertical axis -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="url(#grad1)" stroke-width="1" opacity="0.3"/>
  
  <!-- Horizontal axis -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="url(#grad1)" stroke-width="1" opacity="0.3"/>
  
  <!-- Knowledge nodes (dots at intersections) -->
  <circle cx="32" cy="10" r="2.5" fill="url(#grad2)"/>
  <circle cx="32" cy="54" r="2.5" fill="url(#grad2)"/>
  <circle cx="10" cy="32" r="2.5" fill="url(#grad2)"/>
  <circle cx="54" cy="32" r="2.5" fill="url(#grad2)"/>
  
  <!-- Connection nodes on globe surface -->
  <circle cx="22" cy="20" r="2" fill="url(#grad2)"/>
  <circle cx="42" cy="20" r="2" fill="url(#grad2)"/>
  <circle cx="18" cy="32" r="2" fill="url(#grad2)"/>
  <circle cx="46" cy="32" r="2" fill="url(#grad2)"/>
  <circle cx="22" cy="44" r="2" fill="url(#grad2)"/>
  <circle cx="42" cy="44" r="2" fill="url(#grad2)"/>
  
  <!-- Center node (bright) -->
  <circle cx="32" cy="32" r="3.5" fill="url(#grad2)"/>
  <circle cx="32" cy="32" r="6" stroke="url(#grad2)" stroke-width="1" opacity="0.4"/>
  
  <!-- Connection lines from center to nodes -->
  <line x1="32" y1="32" x2="22" y2="20" stroke="url(#grad1)" stroke-width="0.8" opacity="0.5"/>
  <line x1="32" y1="32" x2="42" y2="20" stroke="url(#grad1)" stroke-width="0.8" opacity="0.5"/>
  <line x1="32" y1="32" x2="22" y2="44" stroke="url(#grad1)" stroke-width="0.8" opacity="0.5"/>
  <line x1="32" y1="32" x2="42" y2="44" stroke="url(#grad1)" stroke-width="0.8" opacity="0.5"/>
  
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
</svg>
