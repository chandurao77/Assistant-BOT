# Assistant Bot Backend Deployment — autoscaling API server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: assistant-bot
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: assistant-bot-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: assistant-bot-config
            - secretRef:
                name: assistant-bot-secrets
          env:
            - name: QDRANT_HOST
              value: qdrant
            - name: REDIS_ENABLED
              value: "true"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assistant-bot-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: secrets-volume
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets-volume
          secret:
            secretName: assistant-bot-file-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: assistant-bot
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
# Horizontal Pod Autoscaler — scale 3-50 replicas based on CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: assistant-bot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
