# ─────────────────────────────────────────────────────────────────────────────
# Assistant Bot — Production Compose (Podman)
# ─────────────────────────────────────────────────────────────────────────────
# Before starting:
#   1. cp .env.example .env && edit .env
#   2. podman compose up -d
#   3. podman compose exec ollama ollama pull mistral
#   4. podman compose exec ollama ollama pull nomic-embed-text
#   5. POST http://localhost:8005/api/ingest  (trigger ingestion)
#   6. Open http://localhost:3000
#
# Secrets (optional):
#   Place secret files in ./secrets/ directory (gitignored).
#   Example: echo "my-strong-jwt-key" > secrets/jwt_secret
#   The backend reads files from /run/secrets/ automatically.
# ─────────────────────────────────────────────────────────────────────────────

# ── Secrets (file-based, optional) ────────────────────────────────────────
# Create ./secrets/ dir and add secret files.
# These are mounted read-only into the backend container at /run/secrets/.
# The backend reads <FIELD>_FILE env vars pointing to files there.

services:

  # ── Qdrant vector database ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: assistant-bot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - internal

  # ── Ollama local LLM ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.6.2
    container_name: assistant-bot-ollama
    restart: unless-stopped
    # Serves the local chat and embedding models. Everything runs on your machine.
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    # No healthcheck — Ollama takes a long time to start and models must be pulled manually.
    # Backend handles connection errors gracefully via retry logic.
    networks:
      - internal

  # ── FastAPI backend (RAG + ingestion) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: assistant-bot-backend
    restart: unless-stopped
    ports:
      - "8005:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama:11434
      # File-based secrets (Podman secrets / K8s / Vault compatible)
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - API_KEY_FILE=/run/secrets/api_key
      - CONFLUENCE_API_TOKEN_FILE=/run/secrets/confluence_api_token
    volumes:
      - ./test_docs:/app/test_docs:ro   # local test documents (read-only mount)
      - backend_data:/app/data          # SQLite DB for conversations + feedback
      - ./backups:/app/backups          # backup destination (host-mounted)
      - ./secrets:/run/secrets:ro       # secret files (read-only mount)
    depends_on:
      - qdrant
      - ollama
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal

  # ── React frontend (nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assistant-bot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

  # ── React frontend with TLS (nginx + HTTPS) ──────────────────────────────
  # Enable with: podman compose --profile tls up -d
  # Requires certs in ./certs/ — generate with: .\generate-certs.ps1
  frontend-tls:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assistant-bot-frontend-tls
    restart: unless-stopped
    profiles:
      - tls
    ports:
      - "443:443"
      - "3000:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./frontend/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:443/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

  # ── Redis (future — shared cache layer) ────────────────────────────────────
  # Not wired into services yet. Enable via REDIS_ENABLED=true in .env.
  # Useful when scaling to multiple backend replicas or adding LLM response caching.
  redis:
    image: redis:7-alpine
    container_name: assistant-bot-redis
    restart: unless-stopped
    profiles:
      - redis                    # only starts with:  podman compose --profile redis up -d
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal

  # ── Ingestion Worker (async background processor) ──────────────────────────
  # Enable with: podman compose --profile worker up -d
  # Reads ingestion jobs from Redis queue, processes independently from API.
  ingest-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: assistant-bot-ingest-worker
    restart: unless-stopped
    profiles:
      - worker
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
    command: ["python", "-m", "app.services.ingest_worker"]
    volumes:
      - ./test_docs:/app/test_docs:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      - qdrant
      - redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    networks:
      - internal

  # ── ELK Stack (Observability — centralized logging + dashboards) ────────────
  # Enable with: podman compose --profile elk up -d
  # Access Kibana at: http://localhost:5601
  # Collects logs from all containers via Filebeat → Logstash → Elasticsearch → Kibana

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: assistant-bot-elasticsearch
    restart: unless-stopped
    profiles:
      - elk
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false          # Dev only — enable in production
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=assistant-bot-logs
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - internal

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: assistant-bot-logstash
    restart: unless-stopped
    profiles:
      - elk
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.monitoring.enabled=false
    ports:
      - "5044:5044"     # Beats input (Filebeat)
      - "5000:5000"     # TCP input (direct from backend)
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      - internal

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: assistant-bot-kibana
    restart: unless-stopped
    profiles:
      - elk
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - internal

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: assistant-bot-filebeat
    restart: unless-stopped
    profiles:
      - elk
    user: root                                 # needed to read container socket
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /run/podman/podman.sock:/var/run/docker.sock:ro
      - /var/lib/containers:/var/lib/docker/containers:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - internal

  # ── PostgreSQL (optional — multi-replica database backend) ────────────────
  # Enable with: podman compose --profile postgres up -d
  # Set DATABASE_URL=postgresql+asyncpg://assistant_bot:assistant_bot@postgres:5432/assistant_bot in .env
  postgres:
    image: postgres:16-alpine
    container_name: assistant-bot-postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_USER: assistant_bot
      POSTGRES_PASSWORD: assistant_bot
      POSTGRES_DB: assistant_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # ── k6 Load Testing ────────────────────────────────────────────────────────
  # Run with: podman compose --profile loadtest run k6 run /scripts/smoke-test.js
  # Scripts:  k6/smoke-test.js, k6/load-test.js, k6/stress-test.js
  k6:
    image: grafana/k6:0.54.0
    container_name: assistant-bot-k6
    profiles:
      - loadtest
    environment:
      - BASE_URL=http://backend:8000
    volumes:
      - ./k6:/scripts:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
  ollama_models:
    driver: local
  backend_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  postgres_data:
    driver: local
