# =============================================================================
# Logstash Pipeline — Assistant Bot
# =============================================================================
# Inputs:
#   1. Beats (port 5044) — Docker container logs via Filebeat
#   2. TCP   (port 5000) — Direct structured logs from backend (JSON)
# =============================================================================

input {
  # Filebeat: collects Docker container logs (all services)
  beats {
    port => 5044
  }

  # Direct TCP: backend sends structured JSON logs here
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # ── Parse Docker container logs ──────────────────────────────────────────
  if [container][name] {
    # Tag by service name
    mutate {
      add_field => { "service" => "%{[container][name]}" }
    }
  }

  # ── Parse JSON log lines from backend (structlog JSON output) ────────────
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "log"
      skip_on_invalid_json => true
    }

    # Promote common fields for easy querying in Kibana
    if [log][level] {
      mutate { add_field => { "log_level" => "%{[log][level]}" } }
    }
    if [log][request_id] {
      mutate { add_field => { "request_id" => "%{[log][request_id]}" } }
    }
    if [log][event] {
      mutate { add_field => { "log_event" => "%{[log][event]}" } }
    }
  }

  # ── Tag by source service ───────────────────────────────────────────────
  if [service] =~ /backend/ {
    mutate { add_tag => ["backend"] }
  } else if [service] =~ /ollama/ {
    mutate { add_tag => ["ollama"] }
  } else if [service] =~ /qdrant/ {
    mutate { add_tag => ["qdrant"] }
  } else if [service] =~ /frontend/ {
    mutate { add_tag => ["frontend"] }
  } else if [service] =~ /redis/ {
    mutate { add_tag => ["redis"] }
  }

  # ── Extract HTTP status codes from nginx access logs ─────────────────────
  if "frontend" in [tags] and [message] =~ /\"(GET|POST|PUT|DELETE|PATCH|OPTIONS)/ {
    grok {
      match => {
        "message" => '%{IP:client_ip} - - \[%{HTTPDATE:timestamp}\] "%{WORD:http_method} %{URIPATHPARAM:request_path} HTTP/%{NUMBER}" %{NUMBER:http_status:int} %{NUMBER:response_bytes:int}'
      }
      tag_on_failure => ["_nginx_parse_failure"]
    }
  }

  # ── Remove noisy fields to save storage ──────────────────────────────────
  mutate {
    remove_field => ["agent", "ecs", "host", "input"]
  }
}

output {
  # Send everything to Elasticsearch with daily indices
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "assistant-bot-logs-%{+YYYY.MM.dd}"
  }

  # Debug output (uncomment for troubleshooting)
  # stdout { codec => rubydebug }
}
