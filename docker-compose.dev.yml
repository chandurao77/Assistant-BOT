# ─────────────────────────────────────────────────────────────────────────────
# Development override — hot-reload for frontend and backend
# Usage: podman compose -f docker-compose.yml -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────────────────────

services:

  backend:
    build:
      target: deps             # Use dependency layer only (no app copy)
    volumes:
      - ./backend/app:/app/app # Hot-reload mounts
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app

  frontend:
    build: null                # Don't use production container image
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - /app/node_modules      # Anonymous volume so host node_modules don't override
    ports:
      - "5173:5173"            # Vite dev server
    environment:
      - VITE_API_BASE=http://localhost:8005
